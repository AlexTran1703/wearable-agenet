; ESP-12F (ESP8266) ECG node: microSD logging + transfer. ECG source: SD replay now, ADC (A0) later.
; Build: ..\esp\.venv\Scripts\pio.exe run      Flash: pio run -t upload      Monitor: pio device monitor
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
upload_port = COM9
upload_speed = 460800
monitor_port = COM9
monitor_speed = 460800
; lwIP v2 "higher bandwidth" (MSS 1460, larger TCP windows): needed for the ~200-ms Internet path to EC2
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
